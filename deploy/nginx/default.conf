# /etc/nginx/sites-available/default (or /etc/nginx/sites-enabled/default)
# Authoritative Ennovera Dual-Microservice Routing Configuration

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 72.62.35.32 aifootballp.com;

    # Premier League & Fantasy Premier League FastAPI Microservice (Port 8001)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # World Cup 2026 Legacy API Microservice (Port 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
